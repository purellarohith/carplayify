name: Run

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Resign with entitlements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download entitlements file and ldid
          curl -fL -O https://raw.githubusercontent.com/itsnebulalol/carplayify/main/ents.plist
          curl -fL -o ${{ github.workspace }}/ldid https://github.com/permasigner/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ${{ github.workspace }}/ldid
          
          # Download the latest release IPA using GitHub CLI
          echo "Fetching latest release IPA..."
          gh release download --repo purellarohith/carplayify --pattern "*.ipa" --dir ${{ github.workspace }} --clobber || true
          
          # List downloaded files for debugging
          echo "Downloaded files:"
          ls -la ${{ github.workspace }}

          # Find and assign the IPA file dynamically
          IPA_FILE=$(find ${{ github.workspace }} -maxdepth 1 -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "Error: No .ipa file was found or downloaded from the latest release."
            exit 1
          fi

          mv "$IPA_FILE" ${{ github.workspace }}/app.ipa

          # Inspect the file header
          echo "File type analysis:"
          file ${{ github.workspace }}/app.ipa

          # Verify zip archive integrity
          if ! unzip -t ${{ github.workspace }}/app.ipa > /dev/null 2>&1; then
            echo "Error: Downloaded file is not a valid zip archive."
            exit 1
          fi

          # Extract and re-sign
          mkdir -p ${{ github.workspace }}/ipa
          unzip ${{ github.workspace }}/app.ipa -d ${{ github.workspace }}/ipa

          ${{ github.workspace }}/ldid -Sents.plist -M ${{ github.workspace }}/ipa/Payload/*
          
          cd ${{ github.workspace }}/ipa
          zip -r ${{ github.workspace }}/App.ipa .

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: ${{ github.workspace }}/App.ipa
